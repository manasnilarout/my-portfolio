<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7928ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0080;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffff00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  
  <!-- Gradient border -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="url(#bgGradient)" stroke-width="2" opacity="0.8"/>
  
  <!-- Inner glow effect -->
  <rect x="2" y="2" width="28" height="28" rx="4" fill="none" stroke="url(#bgGradient)" stroke-width="1" opacity="0.3"/>
  
  <!-- MN Text with gradient -->
  <text x="16" y="21" font-family="'Arial Black', Arial, sans-serif" font-size="13" font-weight="900" text-anchor="middle" fill="url(#textGradient)" filter="url(#glow)">MN</text>
  
  <!-- Subtle tech dots in corners -->
  <circle cx="5" cy="5" r="1" fill="#00d9ff" opacity="0.6"/>
  <circle cx="27" cy="5" r="1" fill="#ff0080" opacity="0.6"/>
  <circle cx="5" cy="27" r="1" fill="#7928ca" opacity="0.6"/>
  <circle cx="27" cy="27" r="1" fill="#00ffff" opacity="0.6"/>
</svg>